# 部署:GitHub Pages。
#
# 选它的理由:Vercel 要先在浏览器里绑定 GitHub 登录连接,Netlify 要本地 CLI ——
# 两者都需要人去点一下。Pages 只需要这个仓库本身。
#
# 关键:下面的 configure-pages 带 enablement: true,会用 workflow 自己的 token
# 调 API **把 Pages 开起来**,所以连 Settings 都不用进。第一次 push 就直接上线。
#
# 站点地址 https://<用户名>.github.io/calc-viz/ ——注意是子路径,所以 vite base 要跟着切。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement: true —— 仓库还没开 Pages 的话,这一步会自动开,不需要人进 Settings
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 门禁:类型检查与单测不过就不部署。数学错了的版本绝不允许上线。
      - run: npm run check
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
